name: Release assets

# release 发布时，或手动指定 tag，构建 CLI 多平台二进制并上传到该 release 的资产
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '要上传资产的 release tag（如 v1.4.4）'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux,   goarch: amd64, out: filesync-linux-amd64 }
          - { goos: linux,   goarch: arm64, out: filesync-linux-arm64 }
          - { goos: windows, goarch: amd64, out: filesync-windows-amd64.exe }
          - { goos: darwin,  goarch: arm64, out: filesync-macos-arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.out }}" .
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" "${{ matrix.out }}" --clobber
